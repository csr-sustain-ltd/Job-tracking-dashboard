<style>
/* Typefaces: the brand uses P22 Mackinac (headings) and McQueen Display (body).
   The copies in the design system are trial/demo files that swap punctuation and
   the figure 4 for "DEMO" marks, so licensed web fonts are needed before they can
   be used here. Until then, close open-licence stand-ins are loaded from Google Fonts. */
/* ===================== Tokens (CSR Sustain design system) =====================
   teal #377679 and mint #AAE8D8 from the icon mark, on white; teal is also the
   approved dark ground, so dark mode is set on teal with white and mint on top. */
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --sunk:#EEF9F6; --ink:#377679; --muted:#377679; --line:#AAE8D8;
  --brand:#377679; --brand-ink:#377679; --brand-soft:#AAE8D8; --on-brand:#FFFFFF; --mint:#AAE8D8; --deep:#377679;
  --warn:#9A5B00; --warn-soft:#FFF3D6; --danger:#B42318; --danger-soft:#FDE8E6; --info:#377679; --info-soft:#EEF9F6;
  --a:#008054; --b:#19B459; --c:#8DCE46; --d:#FFD500; --e:#FCAA65; --f:#EF8023; --g:#E9153B;
  --shadow:0 1px 2px rgba(55,118,121,.08), 0 10px 28px rgba(55,118,121,.10);
  --head:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"Figtree", -apple-system, "Segoe UI", sans-serif;
  --r-sm:4px; --r-md:8px; --r-lg:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#377679; --surface:#2F6668; --sunk:#3F8184; --ink:#FFFFFF; --muted:#AAE8D8; --line:#5B9C9E;
    --brand:#AAE8D8; --brand-ink:#AAE8D8; --brand-soft:#2A5D5F; --on-brand:#377679; --deep:#2A5D5F;
    --warn:#FFD27A; --warn-soft:#3E5A3C; --danger:#FFB4AB; --danger-soft:#5A3F42; --info:#FFFFFF; --info-soft:#2A5D5F;
    --shadow:0 1px 2px rgba(0,0,0,.18), 0 10px 28px rgba(0,0,0,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#377679; --surface:#2F6668; --sunk:#3F8184; --ink:#FFFFFF; --muted:#AAE8D8; --line:#5B9C9E;
    --brand:#AAE8D8; --brand-ink:#AAE8D8; --brand-soft:#2A5D5F; --on-brand:#377679; --deep:#2A5D5F;
    --warn:#FFD27A; --warn-soft:#3E5A3C; --danger:#FFB4AB; --danger-soft:#5A3F42; --info:#FFFFFF; --info-soft:#2A5D5F;
    --shadow:0 1px 2px rgba(0,0,0,.18), 0 10px 28px rgba(0,0,0,.16);
    color-scheme:dark;
}

/* ===================== Base ===================== */
*{box-sizing:border-box;}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px); scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{transition:none !important; animation:none !important;} }
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--surface);}
h1,h2,h3,h4{font-family:var(--head); line-height:1.1; margin:0; color:var(--brand-ink);}
a{color:var(--brand-ink);}
img{max-width:100%;}
button,input,select,textarea{font:inherit; color:inherit;}
:focus-visible{outline:3px solid var(--mint); outline-offset:2px;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.wrap{max-width:1160px; margin:0 auto; padding:0 24px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:8px; border:1px solid transparent; font-weight:600; font-size:15px; cursor:pointer; text-decoration:none; transition:background .15s, border-color .15s;}
.btn-primary{background:var(--brand); color:var(--on-brand);}
.btn-primary:hover{background:var(--brand-ink);}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
.btn-ghost:hover{background:var(--sunk);}
.btn-small{min-height:36px; padding:0 12px; font-size:14px;}
.btn-danger{background:transparent; color:var(--danger); border-color:var(--line);}
.bands{display:inline-flex; flex-direction:column; gap:2px;}
.bands i{display:block; height:3px; border-radius:2px;}

/* ===================== Public site ===================== */
.site-head{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:saturate(1.4) blur(8px); -webkit-backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line);}
.site-head .wrap{display:flex; align-items:center; gap:24px; height:68px;}
.logo{display:flex; align-items:center; text-decoration:none; flex-shrink:0;}
.logo img{display:block; height:40px; width:auto;}
.logo .lg-rev{display:none;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo .lg-col{display:none;} :root:not([data-theme="light"]) .logo .lg-rev{display:block;} }
:root[data-theme="dark"] .logo .lg-col{display:none;} :root[data-theme="dark"] .logo .lg-rev{display:block;}
.side .logo img{height:36px;}
.signin-card .logo img{height:44px;}
.logo .bands i:nth-child(1){width:10px;background:var(--a)} .logo .bands i:nth-child(2){width:13px;background:var(--b)} .logo .bands i:nth-child(3){width:16px;background:var(--c)} .logo .bands i:nth-child(4){width:19px;background:var(--d)} .logo .bands i:nth-child(5){width:22px;background:var(--e)} .logo .bands i:nth-child(6){width:25px;background:var(--f)} .logo .bands i:nth-child(7){width:28px;background:var(--g)}
.site-nav{display:flex; gap:22px; margin-left:auto;}
.site-nav a{color:var(--muted); text-decoration:none; font-weight:500; font-size:15px;}
.site-nav a:hover{color:var(--ink);}
.head-cta{display:flex; gap:10px;}
@media (max-width:820px){ .site-nav{display:none;} .head-cta{margin-left:auto;} .head-cta .btn-ghost{display:none;} }

.hero{padding:72px 0 56px;}
.hero .wrap{display:grid; grid-template-columns:1.05fr 1fr; gap:56px; align-items:center;}
.hero h1{font-size:clamp(36px, 5vw, 58px); font-weight:800;}
.hero p.lead{font-size:19px; color:var(--muted); max-width:34em; margin:22px 0 30px;}
.hero .cta{display:flex; gap:12px; flex-wrap:wrap;}
.hero .small{font-size:14px; color:var(--muted); margin-top:18px;}
@media (max-width:900px){ .hero .wrap{grid-template-columns:1fr; gap:40px;} .hero{padding-top:44px;} }

/* The signature element: a job, laid out as an energy rating scale */
.scale{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 22px 18px; box-shadow:var(--shadow);}
.scale-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; gap:12px;}
.scale-head strong{font-family:var(--head); font-size:17px;}
.scale-head span{font-size:13px; color:var(--muted);}
.scale ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
.scale li{display:grid; grid-template-columns:1fr 128px; align-items:center; gap:10px;}
.bar{position:relative; height:38px; display:flex; align-items:center; padding:0 34px 0 12px; color:#fff; font-weight:600; font-size:14px; clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); white-space:nowrap; transform-origin:left center;}
.bar b{font-family:var(--head); font-size:18px; margin-right:12px; font-weight:800;}
.bar.dark{color:#13232E;}
.scale li .note{font-size:13px; color:var(--muted); white-space:nowrap;}
@media (max-width:560px){ .bar{font-size:13px; height:36px;} .scale li{grid-template-columns:1fr;} .scale li .note{display:none;} }
@keyframes grow{from{transform:scaleX(.15); opacity:0;} to{transform:scaleX(1); opacity:1;}}
.scale .bar{animation:grow .6s cubic-bezier(.2,.7,.2,1) both;}
.scale li:nth-child(2) .bar{animation-delay:.06s} .scale li:nth-child(3) .bar{animation-delay:.12s} .scale li:nth-child(4) .bar{animation-delay:.18s} .scale li:nth-child(5) .bar{animation-delay:.24s} .scale li:nth-child(6) .bar{animation-delay:.30s} .scale li:nth-child(7) .bar{animation-delay:.36s}

.sect{padding:72px 0; border-top:1px solid var(--line);}
.sect h2{font-size:clamp(28px, 3.4vw, 38px); font-weight:750; max-width:20em;}
.sect .intro{color:var(--muted); font-size:18px; max-width:38em; margin:14px 0 40px;}
.tools{display:grid; grid-template-columns:repeat(2, 1fr); gap:0; border-top:1px solid var(--line);}
.tool{padding:28px 28px 30px 0; border-bottom:1px solid var(--line);}
.tool:nth-child(odd){border-right:1px solid var(--line);}
.tool:nth-child(even){padding-left:28px;}
.tool h3{font-size:22px; font-weight:700; display:flex; align-items:center; gap:12px;}
.tool h3 .chip{font-family:var(--body); font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--brand-soft); color:var(--brand-ink);}
.tool p{color:var(--muted); margin:10px 0 14px;}
.tool ul{margin:0; padding-left:18px; color:var(--ink);}
.tool li{margin:4px 0;}
@media (max-width:820px){ .tools{grid-template-columns:1fr;} .tool:nth-child(odd){border-right:0;} .tool:nth-child(even){padding-left:0;} .tool{padding-right:0;} }

/* ---- How a job runs: 3D drive-through (three.js), pinned while you scroll ---- */
.how3d{position:relative; height:280vh; border-top:1px solid var(--line);}
.how-stage{position:sticky; top:calc(env(safe-area-inset-top,0px) + 68px); height:calc(100vh - 68px - env(safe-area-inset-top,0px)); height:calc(100svh - 68px - env(safe-area-inset-top,0px)); overflow:hidden;}
#how-canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}
.how-labels{position:absolute; inset:0; pointer-events:none; z-index:2;}
.how-labels .lbl{position:absolute; left:0; top:0; display:flex; align-items:center; gap:8px; padding:4px 12px 4px 4px; border-radius:999px; background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow); font-size:13px; font-weight:600; white-space:nowrap; opacity:0; transition:opacity .35s; will-change:transform;}
.how-labels .lbl b{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--brand); color:var(--on-brand); font-family:var(--head); font-weight:800; font-size:13px;}
.how-labels .lbl.show{opacity:1;}
.how-panel{position:absolute; z-index:3; top:50%; transform:translateY(-50%); left:max(24px, calc((100% - 1160px) / 2 + 24px)); width:min(380px, calc(100% - 48px)); background:color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:16px; padding:24px 24px 18px; box-shadow:var(--shadow);}
.how-panel h2{font-size:clamp(24px, 2.6vw, 30px); font-weight:750; margin-bottom:6px;}
.how-panel .how-sub{color:var(--muted); font-size:15px; margin:0 0 14px;}
.how-steps{list-style:none; margin:0; padding:0; display:grid;}
.how-steps li{display:grid; grid-template-columns:34px 1fr; gap:12px; padding:9px 0; border-top:1px solid var(--line); opacity:.55; transition:opacity .3s;}
.how-steps li:first-child{border-top:0;}
.how-steps .n{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--line); background:var(--surface); color:var(--muted); font-family:var(--head); font-weight:800; font-size:15px; transition:background .3s, border-color .3s, color .3s;}
.how-steps li.done{opacity:.8;}
.how-steps li.done .n{background:var(--brand-soft); border-color:var(--brand); color:var(--brand-ink);}
.how-steps li.on{opacity:1;}
.how-steps li.on .n{background:var(--brand); border-color:var(--brand); color:var(--on-brand);}
.how-steps h3{font-size:17px; font-weight:700; margin-top:5px;}
.how-steps p{margin:0; color:var(--muted); font-size:15px; max-height:0; opacity:0; overflow:hidden; transition:max-height .45s ease, opacity .3s ease, margin .3s;}
.how-steps li.on p{max-height:90px; opacity:1; margin-top:6px;}
.how-hint{display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:13px; color:var(--muted);}
.how-hint svg{width:16px; height:16px; flex-shrink:0;}
.how-count{display:none;}
@media (max-width:760px){
  .how3d{height:240vh;}
  .how-panel{top:auto; bottom:12px; left:12px; right:12px; width:auto; transform:none; padding:16px 16px 12px;}
  .how-panel h2{font-size:20px;}
  .how-panel .how-sub{display:none;}
  .how-steps li{border-top:0; padding:4px 0;}
  .how-steps li:not(.on){display:none;}
  .how-count{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .how-hint{display:none;}
  .how-labels .lbl{font-size:12px;}
}
/* Without WebGL (or with reduced motion): a plain list of the four steps */
.how3d.static{height:auto; padding:72px 0;}
.how3d.static .how-stage{position:static; height:auto; overflow:visible;}
.how3d.static #how-canvas, .how3d.static .how-labels, .how3d.static .how-hint, .how3d.static .how-count{display:none;}
.how3d.static .how-panel{position:static; transform:none; width:auto; max-width:1112px; margin:0 auto; background:none; border:0; box-shadow:none; padding:0 24px; -webkit-backdrop-filter:none; backdrop-filter:none;}
.how3d.static .how-panel h2{font-size:clamp(28px, 3.4vw, 38px);}
.how3d.static .how-steps{grid-template-columns:repeat(4,1fr); gap:28px; margin-top:24px;}
.how3d.static .how-steps li{display:grid !important; grid-template-columns:1fr; border:0; opacity:1;}
.how3d.static .how-steps li .n{background:var(--brand); border-color:var(--brand); color:var(--on-brand);}
.how3d.static .how-steps p{max-height:none; opacity:1; margin-top:6px;}
@media (max-width:900px){ .how3d.static .how-steps{grid-template-columns:1fr 1fr;} }
@media (max-width:520px){ .how3d.static .how-steps{grid-template-columns:1fr;} }


.plans{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
.plan{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px;}
.plan.featured{border:2px solid var(--brand);}
.plan h3{font-size:24px;}
.plan .who{color:var(--muted); margin:6px 0 18px;}
.plan .price{font-family:var(--head); font-size:20px; font-weight:700; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:18px;}
.plan .price small{display:block; font-family:var(--body); font-size:13px; color:var(--muted); font-weight:400;}
.plan ul{padding-left:18px; margin:0 0 24px;}
.plan li{margin:6px 0;}
@media (max-width:760px){ .plans{grid-template-columns:1fr;} }

.site-foot{position:relative; overflow:hidden; background:var(--deep); color:#D7EEE8; font-size:14px; padding:72px 0 calc(40px + env(safe-area-inset-bottom,0px));}
.site-foot .wrap{position:relative; z-index:1;}
.foot-cta h2{font-size:clamp(28px,3.4vw,40px); font-weight:750; color:#fff; max-width:14em;}
.foot-cta p{color:#BFE3DA; font-size:18px; margin:14px 0 28px; max-width:32em;}
.foot-cta .btn-primary{background:var(--mint); color:#163B3C;}
.foot-cta .btn-primary:hover{background:#C6F1E5;}
.foot-base{display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; margin-top:64px; padding-top:24px; border-top:1px solid rgba(170,232,216,.25);}
.foot-base img{height:34px; width:auto; display:block;}
.foot-mark{position:absolute; right:-40px; top:40px; width:min(520px, 55vw); height:auto; opacity:.16; pointer-events:none; z-index:0;}
@media (max-width:700px){ .foot-mark{opacity:.12; right:-120px;} }

/* ===================== Sign in ===================== */
.signin{min-height:100%; display:grid; place-items:center; padding:40px 20px;}
.signin-card{width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px; box-shadow:var(--shadow);}
.signin-card h1{font-size:28px; margin:22px 0 8px;}
.signin-card p{color:var(--muted); margin:0 0 22px;}
.proto{font-size:13px; background:var(--info-soft); color:var(--info); border-radius:8px; padding:10px 12px; margin:0 0 20px;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:14px; font-weight:600;}
.field .hint{font-size:13px; color:var(--muted);}
.field input,.field select,.field textarea{min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface);}
.field textarea{min-height:84px; resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft);}
.err{color:var(--danger); font-size:14px; margin:-4px 0 12px;}
.signin-actions{display:flex; flex-direction:column; gap:10px; margin-top:8px;}

/* ===================== App shell ===================== */
.app{display:grid; grid-template-columns:248px 1fr; min-height:100%; height:100%;}
html,body{height:100%;}
.side{background:var(--surface); border-right:1px solid var(--line); padding:22px 16px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100%; overflow:auto;}
.side .logo{padding:0 8px 22px;}
.nav-link{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; color:var(--muted); text-decoration:none; font-weight:500;}
.nav-link svg{width:20px; height:20px; flex-shrink:0;}
.nav-link:hover{background:var(--sunk); color:var(--ink);}
.nav-link.on{background:var(--brand-soft); color:var(--brand-ink); font-weight:600;}
.nav-link .count{margin-left:auto; font-size:12px; font-weight:600; background:var(--warn-soft); color:var(--warn); padding:1px 8px; border-radius:999px;}
.side .me{margin-top:auto; border-top:1px solid var(--line); padding:16px 8px 0; font-size:14px;}
.side .me strong{display:block;}
.side .me span{color:var(--muted); font-size:13px;}
.side .me button{margin-top:10px; background:none; border:0; padding:0; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:13px;}
.main{overflow:auto; height:100%;}
.main-in{max-width:1120px; margin:0 auto; padding:32px 32px 80px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:26px;}
.page-head h1{font-size:30px; font-weight:750;}
.page-head p{margin:6px 0 0; color:var(--muted);}
.tabbar{display:none;}
@media (max-width:860px){
  .app{grid-template-columns:1fr;}
  .side{display:none;}
  .main-in{padding:22px 16px 110px;}
  .tabbar{display:grid; grid-template-columns:repeat(6,1fr); position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px);}
  .tabbar a{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px 9px; font-size:11.5px; color:var(--muted); text-decoration:none;}
  .tabbar a svg{width:22px; height:22px;}
  .tabbar a.on{color:var(--brand-ink); font-weight:600;}
}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px;}
.panel-head{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line);}
.panel-head h2{font-size:18px; font-weight:700;}
.panel-head a{font-size:14px; font-weight:600; text-decoration:none;}
.panel-body{padding:16px 20px;}
.stack{display:grid; gap:20px;}
.cols{display:grid; grid-template-columns:2fr 1fr; gap:20px; align-items:start;}
@media (max-width:1320px){ .cols{grid-template-columns:1fr;} .cols > .stack{grid-template-columns:1fr 1fr; align-items:start;} }
@media (max-width:760px){ .cols > .stack{grid-template-columns:1fr;} }
.cols > *, .stack > *{min-width:0;}

.stats{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden;}
.stat{padding:18px 20px; border-right:1px solid var(--line);}
.stat:last-child{border-right:0;}
.stat .n{font-family:var(--head); font-size:30px; font-weight:750; line-height:1.1;}
.stat .l{color:var(--muted); font-size:14px; margin-top:4px;}
@media (max-width:700px){ .stats{grid-template-columns:1fr 1fr;} .stat:nth-child(2){border-right:0;} .stat:nth-child(-n+2){border-bottom:1px solid var(--line);} }

.launch{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.launch a{display:flex; flex-direction:column; gap:6px; padding:16px; border:1px solid var(--line); border-radius:12px; text-decoration:none; color:var(--ink); background:var(--surface); transition:border-color .15s, background .15s; position:relative;}
.launch a:hover{border-color:var(--brand); background:var(--brand-soft);}
.launch a strong{font-size:15px; line-height:1.3;}
.launch a span{font-size:13px; color:var(--muted);}
.launch a .tag{position:absolute; top:14px; right:14px; font-size:11px; font-weight:600; color:var(--muted);}
.launch .ico{width:34px; height:34px; border-radius:8px; display:grid; place-items:center; background:var(--sunk); color:var(--brand-ink); margin-bottom:4px;}
.launch .ico svg{width:20px; height:20px;}
@media (max-width:900px){ .launch{grid-template-columns:1fr 1fr;} }

.jobs{width:100%; border-collapse:collapse; font-size:15px;}
.jobs th{text-align:left; font-size:13px; font-weight:600; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
.jobs td{padding:12px; border-bottom:1px solid var(--line); vertical-align:middle;}
.jobs tr:last-child td{border-bottom:0;}
.jobs .addr strong{display:block; font-weight:600;}
.jobs .addr span{font-size:13px; color:var(--muted);}
.jobs .acts{display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;}
.jobs .acts .btn{white-space:nowrap;}
.jobs td.addr{min-width:220px;}
.jobs td{white-space:nowrap;} .jobs td.addr{white-space:normal;}
.scroll-x{overflow-x:auto;}
.type{display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--sunk); white-space:nowrap;}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:3px 10px; border-radius:999px; white-space:nowrap;}
.pill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor;}
.st-booked{background:var(--info-soft); color:var(--info);}
.st-awaiting{background:var(--warn-soft); color:var(--warn);}
.st-surveyed{background:var(--brand-soft); color:var(--brand-ink);}
.st-modelling{background:var(--sunk); color:var(--ink);}
.st-lodged{background:var(--sunk); color:var(--muted);}
select.status-sel{border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--surface); min-height:36px;}
.jobcards{display:none;}
@media (max-width:760px){
  .jobs-table{display:none;}
  .jobcards{display:grid; gap:10px;}
  .jobcard{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--surface);}
  .jobcard .top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .jobcard .meta{font-size:13px; color:var(--muted); margin:6px 0 12px;}
  .jobcard .acts{display:flex; gap:8px; flex-wrap:wrap;}
}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.toolbar input,.toolbar select{min-height:42px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface);}
.toolbar input{flex:1; min-width:200px;}
.empty{padding:36px 20px; text-align:center; color:var(--muted);}
.empty strong{display:block; color:var(--ink); font-size:17px; margin-bottom:6px;}
.empty .btn{margin-top:14px;}

.ren{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
.ren:last-child{border-bottom:0;}
.ren .when{font-weight:600; white-space:nowrap; text-align:right;}
.ren .when small{display:block; font-weight:400; font-size:13px; color:var(--muted);}
.ren.soon .when{color:var(--warn);}
.ren.over .when{color:var(--danger);}
.ren .addr{font-size:15px;}
.ren .addr > span{display:block; font-size:13px; color:var(--muted); margin-top:2px;}
.note-box{font-size:13px; color:var(--muted); background:var(--sunk); border-radius:8px; padding:10px 12px; margin-top:12px;}

.week{display:grid; gap:2px;}
.day{display:grid; grid-template-columns:64px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
.day:last-child{border-bottom:0;}
.day .d{font-family:var(--head); font-weight:700; line-height:1.2;}
.day .d small{display:block; font-family:var(--body); font-weight:400; color:var(--muted); font-size:12px;}
.day .what{font-size:14px;}
.day .what div{padding:2px 0;}
.day .none{color:var(--muted); font-size:14px;}

/* Drawer */
.scrim{position:fixed; inset:0; background:rgba(8,16,20,.5); z-index:80; display:flex; justify-content:flex-end;}
.drawer{width:min(520px, 100%); height:100%; background:var(--surface); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.drawer-head{display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line);}
.drawer-head h2{font-size:22px;}
.x{background:none; border:0; font-size:28px; line-height:1; cursor:pointer; color:var(--muted); padding:4px 8px;}
.drawer-body{padding:20px 22px; overflow:auto; flex:1;}
.drawer-foot{display:flex; gap:10px; justify-content:space-between; padding:14px 22px; border-top:1px solid var(--line);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
@media (max-width:520px){ .grid2{grid-template-columns:1fr;} }
.seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.seg label{flex:1; text-align:center; padding:10px; cursor:pointer; font-weight:600; font-size:15px; border-right:1px solid var(--line);}
.seg label:last-child{border-right:0;}
.seg input{position:absolute; opacity:0; pointer-events:none;}
.seg input:checked + span{color:var(--brand-ink);}
.seg label:has(input:checked){background:var(--brand-soft);}
.seg label:has(input:focus-visible){outline:3px solid var(--mint); outline-offset:-3px;}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:10px; font-size:15px; z-index:90; box-shadow:var(--shadow);}
@media (max-width:860px){ .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));} }

.settings-sect{margin-bottom:20px;}
.settings-sect .panel-body > p{color:var(--muted); margin:0 0 16px; font-size:15px;}
.row-actions{display:flex; gap:10px; flex-wrap:wrap;}

/* ===================== CSR Sustain design system overrides ===================== */
.site-head{background:color-mix(in srgb, var(--paper) 94%, transparent);}
.side{background:var(--paper);}
.hero h1{font-size:clamp(40px, 5vw, 56px); line-height:1.05; font-weight:400;}
.hero p.lead{color:var(--ink);}
.sect h2, .how-panel h2, .foot-cta h2{font-weight:400; font-size:clamp(28px, 3.2vw, 36px); line-height:1.1;}
.page-head h1{font-weight:400; font-size:clamp(28px, 3vw, 36px);}

.scale-head strong{font-weight:500; font-size:18px;}
.plan .price{font-weight:500;}
.btn{border-radius:9999px; font-weight:500;}
.btn-ghost{border-color:var(--brand); color:var(--brand-ink);}

.type{border-radius:var(--r-sm); font-weight:500; background:var(--brand-soft); color:var(--brand-ink);}
.panel, .plan, .signin-card, .how-panel, .scale{border-radius:var(--r-lg);}
.launch a, .jobcard{border-radius:var(--r-md);}
.field input, .field select, .field textarea, .toolbar input, .toolbar select{border-radius:var(--r-md); border-color:var(--line);}
.tool h3 .chip{border-radius:var(--r-sm); background:var(--brand-soft); color:var(--brand-ink);}
.sect#tools{background:var(--sunk);}
.plan.featured{border:2px solid var(--brand);}
.st-booked{background:var(--brand-soft); color:var(--brand-ink);}
.st-awaiting{background:transparent; color:var(--warn); box-shadow:inset 0 0 0 1.5px currentColor;}
.st-surveyed{background:var(--brand); color:var(--on-brand);}
.st-modelling{background:transparent; color:var(--brand-ink); box-shadow:inset 0 0 0 1.5px var(--brand);}

/* footer on the teal ground, with the three-line graphic device */
.site-foot{background:var(--deep); color:#FFFFFF;}

.foot-base{align-items:flex-start; border-top:1px solid rgba(170,232,216,.4);}
.foot-base img{height:40px;}

.foot-facts{display:flex; flex-direction:column; gap:4px; font-size:13px; line-height:1.4; color:#AAE8D8; text-align:right;}
.foot-thread{position:absolute; right:0; bottom:0; width:min(600px, 60vw); height:auto; pointer-events:none; z-index:0;}
.foot-thread path{fill:none; stroke-width:16; stroke-linecap:butt;}
.foot-thread path:nth-child(1){stroke:#AAE8D8; opacity:.55;}
.foot-thread path:nth-child(2){stroke:#FFFFFF; opacity:.35;}
.foot-thread path:nth-child(3){stroke:#AAE8D8; opacity:.55;}
@media (max-width:700px){ .foot-facts{text-align:left;} .foot-thread{opacity:.5;} }

/* ---- Tools as 3D boxes that turn to face the pointer ---- */
.sect#tools{background:radial-gradient(520px circle at var(--mx, 70%) var(--my, 40%), color-mix(in srgb, var(--mint) 55%, transparent), transparent 70%), var(--sunk); transition:background-position .2s;}
.tools3d{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:44px 40px; perspective:1400px; padding:6px 22px 22px 0;}
.tbox{--rx:7deg; --ry:-10deg; --z:0px; --gx:50%; --gy:50%; --glow:0; position:relative; transform-style:preserve-3d; transform:rotateX(var(--rx)) rotateY(var(--ry)) translateZ(var(--z)); transition:transform .45s cubic-bezier(.2,.7,.2,1);}
.tbox.live{transition:transform .12s linear;}
.tbox-face{position:relative; height:100%; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-md); padding:26px 26px 22px; transform-style:preserve-3d; overflow:visible;}
.tbox-face::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:var(--glow); transition:opacity .3s; background:radial-gradient(260px circle at var(--gx) var(--gy), color-mix(in srgb, var(--mint) 70%, transparent), transparent 70%);}
.tbox-face > *{position:relative; z-index:1;}
.tbox-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; transform:translateZ(36px);}
.tbox-ico{width:46px; height:46px; border-radius:var(--r-md); display:grid; place-items:center; background:var(--brand); color:var(--on-brand); box-shadow:0 10px 18px -8px rgba(55,118,121,.6);}
.tbox-ico svg{width:24px; height:24px;}
.tbox .chip{font-size:12px; font-weight:500; padding:3px 9px; border-radius:var(--r-sm); background:var(--brand-soft); color:var(--brand-ink);}
.tbox h3{font-size:24px; font-weight:500; line-height:1.2; transform:translateZ(26px);}
.tbox p{color:var(--muted); margin:10px 0 12px; transform:translateZ(14px);}
.tbox ul{margin:0 0 14px; padding-left:18px; transform:translateZ(10px);}
.tbox li{margin:4px 0;}
.tbox-open{display:inline-flex; align-items:center; gap:6px; font-weight:500; text-decoration:none; color:var(--brand-ink); border-bottom:1.5px solid var(--mint); padding-bottom:1px; transform:translateZ(20px);}
.tbox-open:hover{border-color:var(--brand);}
.tbox-side{display:none;}
/* depth: the face is extruded with stacked teal layers; JS points the extrusion away from the pointer */
.tbox-face{box-shadow:var(--ext, 1px 1px 0 #3a7b7e, 2px 2px 0 #3a7b7e, 3px 3px 0 #387679, 4px 4px 0 #387679, 5px 5px 0 #357174, 6px 6px 0 #357174, 7px 7px 0 #326c6f, 8px 8px 0 #326c6f, 9px 9px 0 #2f6669, 10px 10px 0 #2f6669, 11px 11px 0 #2c6164, 12px 12px 0 #2c6164, 13px 13px 0 #295b5e, 14px 14px 0 #295b5e); transition:box-shadow .45s cubic-bezier(.2,.7,.2,1);}
.tbox.live .tbox-face{transition:box-shadow .12s linear;}
.tbox::before{content:""; position:absolute; inset:8% 4% -6% 4%; border-radius:var(--r-lg); background:rgba(55,118,121,.28); filter:blur(22px); transform:translateZ(-60px) translateY(calc(18px + var(--z) * .5)); opacity:calc(.55 + var(--glow) * .45); transition:opacity .3s;}
@media (max-width:820px){ .tools3d{grid-template-columns:1fr; gap:40px; padding-right:24px;} }
@media (prefers-reduced-motion: reduce){ .tbox{transition:none;} }

function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s && typeof s === "object") return s; }catch(e){}

}

S.tools = Object.assign({...DEFAULT_TOOLS}, S.tools || {});

Object.keys(DEFAULT_TOOLS).forEach(k => { if(!S.tools[k] || /\/\/csrsustain\.github\.io\//i.test(S.tools[k])) S.tools[k] = DEFAULT_TOOLS[k]; });

/* ---------- renewal rules ---------- */
function validity(job){
  if(job.type === "EPC") return {years:10, rule:"EPCs are valid for 10 years."};
  const a = Number(job.area);
  if(!a) return {years:null, rule:"Add the total useful floor area to work out the DEC renewal date."};
  if(a > 1000) return {years:1, rule:"DEC for a building over 1,000 m²: renew every 12 months."};
  if(a >= 250) return {years:10, rule:"DEC for a building of 250–1,000 m²: valid for 10 years."};
  return {years:null, rule:"Under 250 m² – check whether a DEC is required."};
}
function renewals(){
  const t = todayISO();
  return S.jobs.filter(j => j.status === "lodged" && j.lodged).map(j => {
    const v = validity(j);
    const due = v.years ? addYears(j.lodged, v.years) : null;
    return {job:j, due, days: due ? daysBetween(t, due) : null, rule:v.rule};
  }).sort((a,b) => (a.due ? a.days : 1e9) - (b.due ? b.days : 1e9));
}

/* Tools section: each box turns to face the pointer, the nearest rises
   towards you, and a mint light follows the pointer across the section. */
let toolsCleanup = null;
function initTools3d(){
  if(toolsCleanup){ toolsCleanup(); toolsCleanup = null; }
  const sec = document.getElementById("tools"), grid = document.getElementById("tools3d");
  if(!sec || !grid) return;
  const boxes = [...grid.querySelectorAll(".tbox")];
  const fine = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!fine || reduce) return;              // touch screens keep the resting 3D angle
  let raf = 0, px = 0, py = 0, inside = false;
  const DEPTH = 16;
  const shades = ["#3a7b7e","#387679","#357174","#326c6f","#2f6669","#2c6164","#295b5e","#265558"];
  const extrude = (fx, fy, depth) => { const out = []; for(let i=1;i<=depth;i++) out.push(`${(fx*i).toFixed(2)}px ${(fy*i).toFixed(2)}px 0 ${shades[Math.min(shades.length-1, Math.floor(i/depth*shades.length))]}`); return out.join(","); };
  const rest = () => boxes.forEach(b => { b.classList.remove("live"); b.style.setProperty("--rx","7deg"); b.style.setProperty("--ry","-10deg"); b.style.setProperty("--z","0px"); b.style.setProperty("--glow","0"); b.style.removeProperty("--ext"); });
  const paint = () => {
    raf = 0; if(!inside) return;
    const sr = sec.getBoundingClientRect();
    sec.style.setProperty("--mx", (px - sr.left) + "px"); sec.style.setProperty("--my", (py - sr.top) + "px");
    boxes.forEach(b => {
      const r = b.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dx = (px - cx) / (r.width/2), dy = (py - cy) / (r.height/2);
      const over = Math.abs(dx) <= 1 && Math.abs(dy) <= 1;
      /* only the box under the pointer moves; the others stay still at their resting angle */
      if(!over){
        if(b.classList.contains("live")){ b.classList.remove("live"); b.style.setProperty("--rx","7deg"); b.style.setProperty("--ry","-10deg"); b.style.setProperty("--z","0px"); b.style.setProperty("--glow","0"); b.style.removeProperty("--ext"); }
        return;
      }
      const near = 1;
      const k = 14;
      b.classList.add("live");
      b.style.setProperty("--ry", Math.max(-1, Math.min(1, dx)) * k + "deg");
      b.style.setProperty("--rx", -Math.max(-1, Math.min(1, dy)) * k + "deg");
      b.style.setProperty("--z", (over ? 46 : near * 22).toFixed(1) + "px");
      b.style.setProperty("--glow", over ? "1" : (near * .35).toFixed(2));
      b.style.setProperty("--gx", (px - r.left) + "px"); b.style.setProperty("--gy", (py - r.top) + "px");
      /* the box's depth shows on the side away from the pointer, deeper when it lifts */
      const len = Math.hypot(dx, dy) || 1, fx = -dx/len * Math.min(1, len), fy = -dy/len * Math.min(1, len);
      const d = Math.round(DEPTH * (0.6 + (over ? 0.6 : near * 0.3)));
      b.style.setProperty("--ext", extrude(fx || 0.7, fy || 0.7, d));
    });
  };
  const move = e => { px = e.clientX; py = e.clientY; inside = true; if(!raf) raf = requestAnimationFrame(paint); };
  const leave = () => { inside = false; if(raf){ cancelAnimationFrame(raf); raf = 0; } rest(); };
  sec.addEventListener("pointermove", move);
  sec.addEventListener("pointerleave", leave);
  toolsCleanup = () => { sec.removeEventListener("pointermove", move); sec.removeEventListener("pointerleave", leave); if(raf) cancelAnimationFrame(raf); };
}

/* ============================================================
   HOW A JOB RUNS – 3D drive-through
   A low-poly landscape with a winding road. As the page scrolls, a CSR
   Sustain van drives along it; the road fills in behind the van and each
   stop rises out of the ground when the van reaches it:
     1 job card signboard   2 client's office + paper plane
     3 building being surveyed (camera flash)   4 EPC rating sign + calendar
   Falls back to a plain list without WebGL or with reduced motion.
   ============================================================ */
const THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
let threePromise = null, road3d = null;
function loadThree(){
  if(window.THREE) return Promise.resolve(window.THREE);
  if(!threePromise) threePromise = new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = THREE_URL; sc.async = true;
    sc.onload = () => window.THREE ? res(window.THREE) : rej(new Error("three.js missing"));
    sc.onerror = () => { threePromise = null; rej(new Error("three.js failed to load")); };
    document.head.appendChild(sc);
  });
  return threePromise;
}
function stopRoad(){ if(road3d){ try{ road3d.stop(); }catch(e){} road3d = null; } }
function initRoad(){
  stopRoad();
  const sec = document.getElementById("how"); if(!sec) return;
  const steps = [...sec.querySelectorAll("#how-steps li")];
  const toStatic = () => { sec.classList.add("static"); steps.forEach(li => { li.classList.add("on"); li.classList.remove("done"); }); };
  toStatic();
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let gl = false;
  try{ const c = document.createElement("canvas"); gl = !!(c.getContext("webgl") || c.getContext("experimental-webgl")); }catch(e){}
  if(!gl) return;
  loadThree().then(() => {
    if(!sec.isConnected) return;
    try{ road3d = buildRoadScene(sec, steps); }
    catch(e){ console.warn("3D road unavailable", e); stopRoad(); toStatic(); }
  }).catch(() => {});
}

function buildRoadScene(sec, steps){
  const T = THREE;
  const cs = getComputedStyle(document.documentElement);
  const cssCol = (name, fb) => new T.Color((cs.getPropertyValue(name) || "").trim() || fb);
  const paper = cssCol("--paper", "#F4F6F5");
  const dark = (0.299*paper.r + 0.587*paper.g + 0.114*paper.b) < 0.6;
  const C = dark ? {
    ground:"#2F6668", kerb:"#5B9C9E", asphalt:"#1B3F41", walls:"#FFFFFF", roof:"#AAE8D8", trunk:"#5B4A3C", verge:"#2A5E60", pave:"#6FA9AB", line:"#DDF4EE", lamp:"#0F1C20"
  } : {
    ground:"#D0F2EA", kerb:"#FFFFFF", asphalt:"#2D4F52", walls:"#FFFFFF", roof:"#377679", trunk:"#7A5C45", verge:"#BCE9DC", pave:"#F4F8F7", line:"#FFFFFF", lamp:"#24383D"
  };
  const TEAL = 0x377679, MINT = 0xAAE8D8;

  const stage = sec.querySelector(".how-stage");
  const canvas = sec.querySelector("#how-canvas");
  const labelsEl = sec.querySelector("#how-labels");
  const countEl = sec.querySelector("#how-count");

  const renderer = new T.WebGLRenderer({canvas, antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;

  const scene = new T.Scene();
  scene.background = paper.clone();
  scene.fog = new T.Fog(paper.clone(), 42, 92);
  const camera = new T.PerspectiveCamera(40, 1, 1, 220);

  scene.add(new T.HemisphereLight(0xffffff, dark ? 0x0d1a1f : 0x8fb3a9, dark ? 0.55 : 0.62));
  const sun = new T.DirectionalLight(0xfff6ea, dark ? 0.55 : 0.7);
  sun.position.set(-34, 56, 26); sun.target.position.set(0, 0, -16);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006;
  Object.assign(sun.shadow.camera, {left:-75, right:75, top:75, bottom:-75, near:1, far:180});
  scene.add(sun, sun.target);

  const mat = (c, extra) => new T.MeshStandardMaterial(Object.assign({color:c, roughness:.85, metalness:0}, extra || {}));
  const box = (w, h, d, m) => { const o = new T.Mesh(new T.BoxGeometry(w, h, d), m); o.castShadow = true; o.receiveShadow = true; return o; };
  const cyl = (rt, rb, h, m, seg) => { const o = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg || 10), m); o.castShadow = true; return o; };
  const texture = (w, h, draw) => {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new T.CanvasTexture(c); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
  };
  const rr = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); };

  /* ground */
  const ground = new T.Mesh(new T.PlaneGeometry(420, 420), mat(C.ground, {roughness:1}));
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

  /* the road */
  const curve = new T.CatmullRomCurve3([
    [0,46],[-12,32],[6,18],[14,4],[-4,-10],[-15,-26],[2,-42],[14,-58],[2,-74],[-6,-88]
  ].map(([x,z]) => new T.Vector3(x, 0, z)), false, "centripetal");
  const N = 700;
  const pts = curve.getSpacedPoints(N);
  const tangents = pts.map((_, i) => curve.getTangentAt(i/N));
  /* local bend radius and which side is the inside, so wide strips never fold over on tight bends */

        const rim = cyl(0.29, 0.29, 0.31, rimM, 28); rim.rotation.z = Math.PI/2; spin.add(rim);
        const dish = cyl(0.2, 0.2, 0.33, darkM, 20); dish.rotation.z = Math.PI/2; spin.add(dish);
        for(let k = 0; k < 5; k++){
          const sp = box(0.03, 0.46, 0.07, rimM); sp.castShadow = false; sp.position.x = s * 0.17; sp.rotation.x = k * Math.PI * 2 / 5; spin.add(sp);
        }
        const cap = cyl(0.07, 0.07, 0.34, rimM, 12); cap.rotation.z = Math.PI/2; spin.add(cap);
        van.add(steer); carWheels.push({steer, spin, front});
      });
    });
  }
  // soft contact shadow under the car
  {
    const tex = texture(128, 256, (c, w, h) => { const g = c.createRadialGradient(w/2, h/2, 4, w/2, h/2, h/2); g.addColorStop(0, "rgba(0,0,0,.5)"); g.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = g; c.fillRect(0,0,w,h); });
    const sh = new T.Mesh(new T.PlaneGeometry(3.2, 6.2), new T.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false}));
    sh.rotation.x = -Math.PI/2; sh.position.y = 0.03; van.add(sh);
  }
  van.scale.setScalar(0.95);
  scene.add(van);

  /* trees and a few buildings, kept clear of the road and the stops */
  const clear = (x, z, r) => {
    for(let i=0;i<=N;i+=6){ const p = pts[i]; if((p.x-x)**2 + (p.z-z)**2 < r*r) return false; }
    for(const l of landmarks){ const p = l.holder.position; if((p.x-x)**2 + (p.z-z)**2 < 64) return false; }
    return true;
  };
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const TREES = 170;
  const crowns = new T.InstancedMesh(new T.ConeGeometry(1, 2.4, 7), new T.MeshStandardMaterial({roughness:.9}), TREES);
  const trunks = new T.InstancedMesh(new T.CylinderGeometry(0.14, 0.18, 0.9, 6), mat(C.trunk), TREES);
  crowns.castShadow = true; trunks.castShadow = true;
  const greens = dark ? [0x2E6E6B, 0x3F8C83, 0x5FAFA6] : [0x377679, 0x5FAFA6, 0x7FC9B6, 0x4E9A8F];
  let placed = 0, tries = 0;
  while(placed < TREES && tries < 6000){
    tries++;
    const x = (rnd()-0.5)*120, z = 70 - rnd()*175;
    if(!clear(x, z, 5.2)) continue;
    const s = 0.8 + rnd()*0.9;
    m4.compose(new T.Vector3(x, 0.45*s, z), new T.Quaternion(), new T.Vector3(s, s, s)); trunks.setMatrixAt(placed, m4);
    m4.compose(new T.Vector3(x, (0.9 + 1.2)*s, z), new T.Quaternion().setFromAxisAngle(up, rnd()*6), new T.Vector3(s, s, s)); crowns.setMatrixAt(placed, m4);
    crowns.setColorAt(placed, new T.Color(greens[Math.floor(rnd()*greens.length)]));
    placed++;
  }
  crowns.count = trunks.count = placed;
  scene.add(crowns, trunks);
  const blds = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), new T.MeshStandardMaterial({roughness:.8}), 14);
  blds.castShadow = true; blds.receiveShadow = true;
  let nb = 0; tries = 0;
  while(nb < 14 && tries < 3000){
    tries++;
    const x = (rnd()-0.5)*110, z = 60 - rnd()*160;
    if(!clear(x, z, 9)) continue;
    const w = 3 + rnd()*3, h = 2 + rnd()*4, d = 3 + rnd()*3;
    m4.compose(new T.Vector3(x, h/2, z), new T.Quaternion().setFromAxisAngle(up, rnd()*Math.PI), new T.Vector3(w, h, d)); blds.setMatrixAt(nb, m4);
    blds.setColorAt(nb, new T.Color(dark ? [0x2A3B42, 0x33484F, 0x24575A][nb%3] : [0xFFFFFF, 0xEDF2F1, 0xD6E8E3][nb%3]));
    nb++;
  }
  blds.count = nb; scene.add(blds);

  /* scroll -> position along the road */
  let target = 0.03, cur = 0.03, raf = 0, running = false, last = performance.now();
  const camPos = new T.Vector3(), camLook = new T.Vector3(); let camInit = false;
  const v = new T.Vector3();
  function readScroll(){
    const r = sec.getBoundingClientRect(), total = sec.offsetHeight - stage.offsetHeight;
    const headerOffset = parseFloat(getComputedStyle(stage).top) || 0;
    const p = total > 0 ? Math.max(0, Math.min(1, (headerOffset - r.top) / total)) : 0;
    target = 0.03 + p * 0.88;
  }
  let narrow = false;
  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight; if(!w || !h) return;
    renderer.setSize(w, h, false);
    narrow = w < 760;
    camera.aspect = w / h; camera.fov = narrow ? 58 : 40;
    /* keep the van clear of the text panel: shift the view right on wide screens, up on phones */
    if(w >= 760) camera.setViewOffset(w, h, -Math.min(200, w * 0.12), 0, w, h); else camera.setViewOffset(w, h, 0, h * 0.2, w, h);
    camera.updateProjectionMatrix();
  }
  function frame(now){
    raf = running ? requestAnimationFrame(frame) : 0;
    const dt = Math.min(0.25, (now - last) / 1000); last = now; const time0 = now / 1000;
    cur += (target - cur) * Math.min(1, dt * 5);
    const u = Math.max(0, Math.min(1, cur));
    const p = curve.getPointAt(u), t = curve.getTangentAt(u);
    const heading = Math.atan2(t.x, t.z);
    van.position.set(p.x, 0.08, p.z); van.rotation.y = heading;
    const t2 = curve.getTangentAt(Math.min(1, u + 0.012));
    let dh = Math.atan2(t2.x, t2.z) - heading; while(dh > Math.PI) dh -= 2*Math.PI; while(dh < -Math.PI) dh += 2*Math.PI;
    const steerWant = Math.max(-0.5, Math.min(0.5, dh * 16));
    const spinNow = u * ROAD_LEN / 0.42;
    carWheels.forEach(w => { w.spin.rotation.x = spinNow; if(w.front) w.steer.rotation.y += (steerWant - w.steer.rotation.y) * Math.min(1, dt * 8); });
    if(carBody){ carBody.rotation.z += (-steerWant * 0.05 - carBody.rotation.z) * Math.min(1, dt * 5); carBody.position.y = Math.sin(time0 * 3 + u * 90) * 0.012; }
    fillGeo.setDrawRange(0, Math.floor(u * N) * 6);

    // camera follows from behind, above and slightly to the side
    const side = new T.Vector3(t.z, 0, -t.x).normalize();
    const K = narrow ? {back:19, side:2, up:20, ahead:8, look:-6.5} : {back:17, side:7, up:15, ahead:7, look:-3};
    const wantPos = v.copy(p).addScaledVector(t, -K.back).addScaledVector(side, K.side).add(new T.Vector3(0, K.up, 0));
    const wantLook = p.clone().addScaledVector(t, K.ahead).addScaledVector(side, K.look);
    if(!camInit){ camPos.copy(wantPos); camLook.copy(wantLook); camInit = true; }
    camPos.lerp(wantPos, Math.min(1, dt * 3)); camLook.lerp(wantLook, Math.min(1, dt * 3));
    camera.position.copy(camPos); camera.lookAt(camLook);

    // stops: rise when reached, labels follow them
    let active = 0;
    const w = stage.clientWidth, h = stage.clientHeight;
    landmarks.forEach((L, i) => {
      const reached = u >= STOPS[i] - 0.05;
      if(reached) active = i;
      const goal = reached ? 1 : 0.001;
      L.s += (goal - L.s) * Math.min(1, dt * 6);
      const e = L.s < 0.002 ? 0.001 : L.s;
      L.group.scale.set(e, e, e);
      L.group.visible = L.s > 0.01;
      const tp = L.holder.position.clone(); tp.y = L.top * Math.max(0.2, e);
      tp.project(camera);
      const vis = reached && L.s > 0.6 && tp.z < 1 && Math.abs(tp.x) < 1.1 && Math.abs(tp.y) < 1.1;
      L.lbl.classList.toggle("show", vis);
      L.lbl.style.transform = `translate(${((tp.x + 1) / 2) * w}px, ${((1 - tp.y) / 2) * h}px) translate(-50%, -120%)`;
    });
    steps.forEach((li, k) => { li.classList.toggle("on", k === active); li.classList.toggle("done", k < active); });
    if(countEl) countEl.textContent = "Step " + (active + 1) + " of 4";

    // little animations
    const time = now / 1000;
    if(plane){ const a = time * 0.9; plane.position.set(Math.cos(a) * 3.2, 5.2 + Math.sin(time * 2) * 0.3, Math.sin(a) * 3.2); plane.rotation.y = -a; plane.rotation.z = Math.sin(time * 2) * 0.2; }
    if(flashMat){ const ph = (time % 2.2); flashMat.opacity = landmarks[2].s > 0.9 && ph < 0.25 ? (1 - ph / 0.25) : 0; flash.scale.setScalar(1 + (ph < 0.25 ? ph * 6 : 0)); }

    renderer.render(scene, camera);
  }
  const start = () => { if(!running){ running = true; last = performance.now(); raf = requestAnimationFrame(frame); } };
  const pause = () => { running = false; if(raf) cancelAnimationFrame(raf); raf = 0; };
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? start() : pause()), {rootMargin:"200px 0px"});
  io.observe(sec);
  const onScroll = () => readScroll();
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", resize);
  const ro = window.ResizeObserver ? new ResizeObserver(resize) : null; if(ro) ro.observe(stage);

  sec.classList.remove("static");
  steps.forEach((li, k) => { li.classList.toggle("on", k === 0); li.classList.remove("done"); });
  resize(); readScroll(); cur = target; start();

  return { stop(){
    pause(); io.disconnect(); if(ro) ro.disconnect();
    window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", resize);
    scene.traverse(o => { if(o.geometry) o.geometry.dispose(); const m = o.material; (Array.isArray(m) ? m : m ? [m] : []).forEach(x => { if(x.map) x.map.dispose(); x.dispose(); }); });
    renderer.dispose(); labelsEl.innerHTML = "";
  }};
}

/* Save a generated file: the claude.ai downloads capability when the page is
   published there, otherwise a normal browser download. */
async function saveFile(filename, text, type){
  try{
    if(window.claude && window.claude.use){
      const dl = await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 1500))]);
      if(dl){ await dl.save({filename, data:text}); return; }
    }
  }catch(e){ if(e && e.code === "declined") return; }
  const blob = new Blob([text], {type});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function dueTag(j){
  if(j.status === "lodged") return `<span class="tag due-done">Done</span>`;
  if(!j.inspect) return `<span class="tag due-later">No date</span>`;
  const d = daysBetween(todayISO(), j.inspect);
  if(d < 0 && (j.status === "booked" || j.status === "awaiting")) return `<span class="tag due-over">Overdue</span>`;
  if(d < 0) return `<span class="tag due-done">Visited</span>`;
  if(d === 0) return `<span class="tag due-today">Today</span>`;
  if(d < 7) return `<span class="tag due-week">This week</span>`;
  return `<span class="tag due-later">Later</span>`;
}
const ago = iso => {
  if(!iso) return "–";
  const d = daysBetween(iso.slice(0,10), todayISO());
  return d <= 0 ? "Today" : d === 1 ? "Yesterday" : d < 30 ? d + " days ago" : fmtDate(iso.slice(0,10));
};
function renRow(r){
  const j = r.job;
  const cls = r.days === null ? "r-need" : r.days < 0 ? "r-over" : r.days <= 90 ? "r-soon" : "r-ok";

  return `<div class="rrow"><div>${esc(j.address)}<span>${esc(j.type)} – ${r.due ? fmtDate(r.due) : "no date"}</span></div><span class="tag ${cls}">${when}</span></div>`;
}

/* ---------- Route Planner ---------- */
const normPC = p => String(p || "").toUpperCase().replace(/\s+/g, "").replace(/^(.+)(\d[A-Z]{2})$/, "$1 $2");
const hav = (a, b) => {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
/* Straight-line distance x 1.3 approximates road distance; 40 km/h average for mixed urban driving. */
const ROAD_FACTOR = 1.3, AVG_KMH = 40;
const roadKm = (a, b) => hav(a, b) * ROAD_FACTOR;
const fmtKm = km => (km * 0.621371).toFixed(1) + " mi";
const fmtMin = km => { const m = Math.round(km / AVG_KMH * 60); return m < 60 ? m + " min" : Math.floor(m/60) + " h " + (m % 60) + " min"; };

async function geocode(postcodes){
  S.geo = S.geo || {};
  const need = [...new Set(postcodes.map(normPC).filter(p => p && !(p in S.geo)))];
  for(let i = 0; i < need.length; i += 100){
    const chunk = need.slice(i, i + 100);
    const res = await fetch("https://api.postcodes.io/postcodes", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({postcodes:chunk})});
    if(!res.ok) throw new Error("Postcode lookup failed (" + res.status + ")");
    const data = await res.json();
    (data.result || []).forEach((r, k) => {
      S.geo[chunk[k]] = r.result ? {lat:r.result.latitude, lon:r.result.longitude} : null;
    });
  }
  save();
}

/* Order stops with nearest-neighbour then 2-opt.
   pts[0] is the start. endIdx: null = finish at the last stop, 0 = return to start,
   otherwise the index in pts of a separate fixed end point (not a stop).
   Returns indices (into pts) of the stops in visiting order. */
function optimiseOrder(pts, endIdx){
  const n = pts.length;
  const stops = []; for(let i = 1; i < n; i++) if(i !== endIdx) stops.push(i);
  if(stops.length < 2) return stops;
  const D = pts.map(a => pts.map(b => roadKm(a, b)));
  const left = new Set(stops);
  let path = [0], cur = 0;
  while(left.size){
    let best = -1, bd = Infinity;
    left.forEach(j => { if(D[cur][j] < bd){ bd = D[cur][j]; best = j; } });
    path.push(best); left.delete(best); cur = best;
  }
  const hasEnd = endIdx !== null && endIdx !== undefined;
  if(hasEnd) path.push(endIdx);
  const len = p => p.reduce((s, v, i) => i ? s + D[p[i-1]][v] : 0, 0);
  const last = hasEnd ? path.length - 2 : path.length - 1;
  let improved = true, guard = 0;
  while(improved && guard++ < 200){
    improved = false;
    for(let i = 1; i < last; i++) for(let k = i + 1; k <= last; k++){
      const cand = path.slice(0, i).concat(path.slice(i, k + 1).reverse(), path.slice(k + 1));
      if(len(cand) < len(path) - 1e-9){ path = cand; improved = true; }
    }
  }
  return path.slice(1, hasEnd ? -1 : undefined);
}

/* Leaflet is loaded on demand. Tiles come from Esri (free, no key), with OpenStreetMap as backup. */
let leafletPromise = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(!leafletPromise) leafletPromise = new Promise((res, rej) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; sc.async = true;
    sc.onload = () => window.L ? res(window.L) : rej(new Error("Map library missing"));
    sc.onerror = () => { leafletPromise = null; rej(new Error("Map library failed to load")); };
    document.head.appendChild(sc);
  });
  return leafletPromise;
}

let RP = {range:"week", map:null, note:"", hide:[]};
function pageRoute(pg){
  document.title = "Route Planner – " + BRAND;
  if(RP.map){ try{ RP.map.remove(); }catch(e){} RP.map = null; }
  S.route = Object.assign({start:"BL9 5BT", finish:"start", end:"", selected:[], order:[]}, S.route || {});
  delete S.route.closed;
  S.geo = S.geo || {};
  const t = todayISO(), weekEnd = addDays(t, 6);
  const candidates = () => S.jobs.filter(j => RP.range === "everything" ? true : (j.status !== "lodged" && j.inspect && j.inspect >= t && (RP.range === "week" ? j.inspect <= weekEnd : true)))
    .sort((a, b) => (a.inspect || "9999").localeCompare(b.inspect || "9999"));
  const isSel = j => S.route.selected.includes(j.id);
  /* ticked jobs in route order, then the rest by date */
  const sequence = () => {
    const c = candidates(), ord = S.route.order;
    const sel = c.filter(isSel).sort((a, b) => {
      const ia = ord.indexOf(a.id), ib = ord.indexOf(b.id);
      return (ia < 0 ? 1e6 : ia) - (ib < 0 ? 1e6 : ib);
    });
    return {sel, rest:c.filter(j => !isSel(j))};
  };
  const coord = j => S.geo[normPC(j.postcode)] || null;
  const pc = v => S.geo[normPC(v)] || null;
  const endPoint = () => S.route.finish === "start" ? pc(S.route.start) : S.route.finish === "other" ? pc(S.route.end) : null;
  const endLabel = () => S.route.finish === "start" ? S.route.start : S.route.end;

  pg.innerHTML = `
  <div class="page-head">
    <div><h1>Weekly Inspection Route</h1><p>Tick the jobs you want to visit, then optimise the order.</p></div>
  </div>
  <section class="box" style="margin-bottom:22px"><div class="box-head"><h2>Route settings</h2></div>
    <div style="padding:16px 18px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
      <div class="field" style="margin:0"><label for="rp-start">Start point (postcode)</label><input id="rp-start" value="${esc(S.route.start)}" autocapitalize="characters" style="max-width:150px"></div>
      <div class="field" style="margin:0"><label for="rp-finish">Finish</label><select id="rp-finish">
        <option value="start"${S.route.finish === "start" ? " selected" : ""}>Return to start point</option>
        <option value="other"${S.route.finish === "other" ? " selected" : ""}>End at a different postcode</option>
        <option value="last"${S.route.finish === "last" ? " selected" : ""}>End at the last stop</option></select></div>
      <div class="field" id="rp-end-wrap" style="margin:0"><label for="rp-end">End point (postcode)</label><input id="rp-end" value="${esc(S.route.end)}" autocapitalize="characters" style="max-width:150px"></div>
      <div class="field" style="margin:0"><label for="rp-range">Show jobs</label><select id="rp-range"><option value="week"${RP.range === "week" ? " selected" : ""}>Next 7 days</option><option value="all"${RP.range === "all" ? " selected" : ""}>All upcoming</option><option value="everything"${RP.range === "everything" ? " selected" : ""}>Every job (incl. lodged)</option></select></div>
      <button class="btn btn-primary" type="button" id="rp-opt" style="margin-left:auto;min-height:48px;padding:0 24px;font-size:16px">${SVG('<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/>')}Optimize Route Sequence</button>
    </div>
  </section>
  <section class="box" style="margin-bottom:22px">
    <div id="rp-legend" style="display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)"></div>
    <div id="rp-map" style="height:480px;border-radius:8px;overflow:hidden" role="region" aria-label="Map of selected jobs"></div>
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;font-size:14px"><span id="rp-total"></span><span id="rp-note" style="color:var(--muted)"></span></div>
  </section>
  <section class="box"><div class="box-head"><h2 id="rp-count">Jobs</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="mini" type="button" id="rp-all">Tick all</button><button class="mini" type="button" id="rp-none">Clear</button><button class="mini" type="button" id="rp-maps">Open in Google Maps</button></div></div>
    <div class="dt-wrap"><table class="dt" style="min-width:760px"><thead><tr><th><span class="sr">Include</span></th><th>Stop</th><th>Type / status</th><th>Date</th><th>Postcode</th><th>Leg</th><th>Order</th></tr></thead><tbody id="rp-body"></tbody></table></div>
    <div class="note-box" style="margin:12px 18px 16px">Lines on the map are straight-line estimates, not road routes. Distances use straight-line × ${ROAD_FACTOR} and ${AVG_KMH} km/h.</div>
  </section>`;
  const $ = s => pg.querySelector(s);

  let layer = null;
  const drawMap = (sel, sp, ep) => {
    if(!RP.map || !window.L) return;
    const L = window.L;
    if(layer) layer.remove();
    layer = L.layerGroup().addTo(RP.map);
    const latlngs = [];
    const icon = (txt, bg, ring) => L.divIcon({className:"", html:`<div style="width:30px;height:30px;border-radius:50%;background:${bg};color:#fff;font:700 14px Figtree,sans-serif;display:grid;place-items:center;border:3px solid ${ring || "#fff"};box-shadow:0 2px 6px rgba(0,0,0,.35)">${txt}</div>`, iconSize:[30, 30], iconAnchor:[15, 15], popupAnchor:[0, -14]});
    const tagHtml = st => `<span style="background:${STATUS_COLOUR[st]};color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700">${esc(STATUS_LABEL[st] || st)}</span>`;
    const bgPts = [], selIds = new Set(sel.map(j => j.id));
    S.jobs.forEach(j => {
      const c = coord(j); if(!c || selIds.has(j.id) || RP.hide.includes(j.status)) return;
      bgPts.push([c.lat, c.lon]);
      const pill = L.divIcon({className:"", html:`<div style="transform:translate(-50%,-50%);display:inline-block;white-space:nowrap;background:${STATUS_COLOUR[j.status]};color:#fff;font:700 11px Figtree,sans-serif;padding:3px 8px;border-radius:999px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)">${esc(STATUS_LABEL[j.status] || j.status)}</div>`, iconSize:[0, 0]});
      L.marker([c.lat, c.lon], {icon:pill}).bindPopup(`${tagHtml(j.status)} <strong>${esc(j.type)}</strong><br><strong>${esc(j.address)}</strong><br>${esc(j.client || "")}<br>${esc(j.ref || "")} · ${j.inspect ? esc(fmtDate(j.inspect)) : "no date"}<br>${esc(j.postcode)}`).addTo(layer);
    });
    if(sp){ latlngs.push([sp.lat, sp.lon]); L.marker([sp.lat, sp.lon], {icon:icon("★", "#E9153B")}).bindPopup("<strong>Start</strong><br>" + esc(S.route.start)).addTo(layer); }
    sel.forEach((j, i) => {
      const c = coord(j); if(!c) return;
      latlngs.push([c.lat, c.lon]);
      L.marker([c.lat, c.lon], {icon:icon(i + 1, "#377679", STATUS_COLOUR[j.status])}).bindPopup(`${tagHtml(j.status)} <strong>Stop ${i + 1}</strong><br><strong>${esc(j.address)}</strong><br>${esc(j.client || "")}<br>${esc(j.type)} · ${esc(fmtDate(j.inspect))}<br>${esc(j.postcode)}`).addTo(layer);
    });
    if(ep){
      latlngs.push([ep.lat, ep.lon]);
      if(S.route.finish === "other") L.marker([ep.lat, ep.lon], {icon:icon("⚑", "#8B5CF6")}).bindPopup("<strong>End</strong><br>" + esc(S.route.end)).addTo(layer);
    }
    if(latlngs.length > 1) L.polyline(latlngs, {color:"#377679", weight:4, opacity:.85, dashArray:"8 8"}).addTo(layer);
    RP.map.invalidateSize();
    const fit = latlngs.length > 1 ? latlngs : latlngs.concat(bgPts);
    if(fit.length) RP.map.fitBounds(fit, {padding:[40, 40], maxZoom:13});
  };

  const draw = () => {
    const {sel, rest} = sequence();
    const sp = pc(S.route.start), ep = endPoint();
    $("#rp-end-wrap").style.display = S.route.finish === "other" ? "" : "none";
    const rowFor = (j, i, ticked, leg) => `<tr>
      <td><input type="checkbox" data-tick="${j.id}" aria-label="Include ${esc(j.address)}" ${ticked ? "checked" : ""} style="width:18px;height:18px"></td>
      <td class="title"><strong title="${esc(j.address)}">${ticked ? (i + 1) + ". " : ""}${esc(j.address)}</strong><span>${esc(j.client || "")}</span></td>
      <td>${typeTag(j)} ${statusPill(j.status)}</td>
      <td>${j.inspect ? esc(fmtDay(j.inspect)) + " " + esc(fmtDate(j.inspect)) : "–"}</td>
      <td>${j.postcode ? esc(j.postcode) : '<span class="tag r-need">No postcode</span>'}${j.postcode && S.geo[normPC(j.postcode)] === null ? ' <span class="tag r-over">Not found</span>' : ""}</td>
      <td>${leg}</td>
      <td>${ticked ? `<div class="acts"><button class="mini" type="button" data-up="${i}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button><button class="mini" type="button" data-down="${i}" aria-label="Move down" ${i === sel.length - 1 ? "disabled" : ""}>↓</button></div>` : ""}</td></tr>`;
    let rows = "", prev = sp, total = 0, any = false;
    sel.forEach((j, i) => {
      const c = coord(j); let leg = "–";
      if(c && prev){ const km = roadKm(prev, c); total += km; leg = fmtKm(km) + " · " + fmtMin(km); }
      if(c){ prev = c; any = true; }
      rows += rowFor(j, i, true, leg);
    });
    if(any && ep && prev){ total += roadKm(prev, ep); }
    rows += rest.map(j => rowFor(j, 0, false, "")).join("");
    $("#rp-body").innerHTML = rows || `<tr><td colspan="7"><div class="empty2"><strong>No upcoming inspections</strong>Add jobs with an inspection date to plan a route.</div></td></tr>`;
    $("#rp-count").textContent = sel.length + " of " + (sel.length + rest.length) + " jobs ticked";
    $("#rp-total").textContent = any && sp ? "Total " + fmtKm(total) + " · about " + fmtMin(total) + " driving" : "Tick jobs to show them on the map.";
    const missing = sel.filter(j => !coord(j)).length;
    $("#rp-note").textContent = RP.note || (missing ? missing + " ticked job(s) have no usable postcode and aren't on the map." : "");
    pg.querySelectorAll("[data-tick]").forEach(cb => cb.addEventListener("change", () => {
      const id = cb.dataset.tick, sset = new Set(S.route.selected);
      if(cb.checked){ sset.add(id); S.route.order = S.route.order.filter(x => x !== id).concat(id); } else sset.delete(id);
      S.route.selected = [...sset]; RP.note = ""; save(); draw();
    }));
    pg.querySelectorAll("[data-up],[data-down]").forEach(b => b.addEventListener("click", () => {
      const i = Number(b.dataset.up ?? b.dataset.down), k = b.dataset.up !== undefined ? i - 1 : i + 1;
      const ids = sequence().sel.map(j => j.id); [ids[i], ids[k]] = [ids[k], ids[i]];
      S.route.order = ids.concat(S.route.order.filter(x => !ids.includes(x))); RP.note = ""; save(); draw();
    }));
    const counts = {}; S.jobs.forEach(j => { if(coord(j)) counts[j.status] = (counts[j.status] || 0) + 1; });
    $("#rp-legend").innerHTML = `<span style="font-size:13.5px;align-self:center;opacity:.8">All jobs on map:</span>` + STATUSES.map(([v, l]) => `<button type="button" class="mini" data-st="${v}" aria-pressed="${!RP.hide.includes(v)}" style="display:inline-flex;gap:6px;align-items:center;${RP.hide.includes(v) ? "opacity:.45;" : ""}"><i style="width:10px;height:10px;border-radius:50%;background:${STATUS_COLOUR[v]}"></i>${l} (${counts[v] || 0})</button>`).join("") + `<span style="font-size:13px;align-self:center;opacity:.8">Ticked jobs are numbered route stops.</span>`;
    $("#rp-legend").querySelectorAll("[data-st]").forEach(b => b.addEventListener("click", () => { const v = b.dataset.st; RP.hide = RP.hide.includes(v) ? RP.hide.filter(x => x !== v) : RP.hide.concat(v); draw(); }));
    drawMap(sel, sp, ep);
  };

  const lookup = async () => {
    try{ await geocode([S.route.start, S.route.end, ...S.jobs.map(j => j.postcode)].filter(Boolean)); }
    catch(e){ RP.note = "Couldn't look up postcodes (check your connection). " + e.message; }
  };
  const readSettings = () => {
    $("#rp-start").value = $("#rp-start").value.trim().toUpperCase(); $("#rp-end").value = $("#rp-end").value.trim().toUpperCase();
    S.route.start = $("#rp-start").value; S.route.end = $("#rp-end").value; S.route.finish = $("#rp-finish").value; save();
  };
  const refresh = async () => { RP.note = ""; readSettings(); draw(); await lookup(); draw(); };

  $("#rp-start").addEventListener("change", refresh); $("#rp-end").addEventListener("change", refresh);
  $("#rp-finish").addEventListener("change", refresh);
  $("#rp-range").addEventListener("change", e => { RP.range = e.target.value; refresh(); });
  $("#rp-all").addEventListener("click", () => { const ids = candidates().map(j => j.id); S.route.selected = [...new Set(S.route.selected.concat(ids))]; ids.forEach(id => { if(!S.route.order.includes(id)) S.route.order.push(id); }); RP.note = ""; save(); draw(); });
  $("#rp-none").addEventListener("click", () => { const ids = candidates().map(j => j.id); S.route.selected = S.route.selected.filter(x => !ids.includes(x)); RP.note = ""; save(); draw(); });

  $("#rp-opt").addEventListener("click", async () => {
    const btn = $("#rp-opt"); btn.disabled = true;
    try{
      readSettings(); await lookup();
      const sp = pc(S.route.start);
      if(!sp){ RP.note = "The start postcode wasn't recognised. Check it and try again."; draw(); return; }
      if(S.route.finish === "other" && !pc(S.route.end)){ RP.note = "The end postcode wasn't recognised. Check it and try again."; draw(); return; }
      const {sel} = sequence(), ok = sel.filter(coord), bad = sel.filter(j => !coord(j));
      if(ok.length < 2){ RP.note = "Tick at least two jobs with valid postcodes to optimise."; draw(); return; }
      const pts = [sp, ...ok.map(coord)];
      let endIdx = null;
      if(S.route.finish === "start") endIdx = 0;
      else if(S.route.finish === "other"){ pts.push(pc(S.route.end)); endIdx = pts.length - 1; }
      const lenOf = list => { let p = sp, s = 0; list.forEach(j => { const c = coord(j); s += roadKm(p, c); p = c; }); const e = endPoint(); return s + (e ? roadKm(p, e) : 0); };
      const before = lenOf(ok);
      const order = optimiseOrder(pts, endIdx).map(i => ok[i - 1]);
      const after = lenOf(order);
      const ids = order.concat(bad).map(j => j.id);
      S.route.order = ids.concat(S.route.order.filter(x => !ids.includes(x)));
      RP.note = after < before - 0.05 ? "Route optimised: " + fmtKm(before - after) + " shorter (" + fmtKm(before) + " → " + fmtKm(after) + ")." : "Route optimised: this order was already the shortest found.";
      save(); draw(); toast("Route optimised.");
    }catch(e){ RP.note = "Couldn't optimise: " + e.message; draw(); }
    finally{ btn.disabled = false; }
  });

  $("#rp-maps").addEventListener("click", () => {
    const {sel} = sequence();
    if(!sel.length){ toast("Tick some jobs first."); return; }
    const stops = sel.map(j => [j.address, j.postcode].filter(Boolean).join(", "));
    const origin = S.route.start;
    const fin = S.route.finish, dest = fin === "start" ? origin : fin === "other" ? S.route.end : stops[stops.length - 1];
    const via = fin === "last" ? stops.slice(0, -1) : stops;
    const url = "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + encodeURIComponent(origin) + "&destination=" + encodeURIComponent(dest) + (via.length ? "&waypoints=" + encodeURIComponent(via.slice(0, 9).join("|")) : "");
    if(via.length > 9) toast("Google Maps takes up to 9 stops per link; the first 9 are included.");
    const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
  });

  loadLeaflet().then(L => {
    if(!$("#rp-map")) return;
    RP.map = L.map("rp-map", {scrollWheelZoom:false}).setView([53.55, -2.3], 9);
    const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, attribution:"Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, OpenStreetMap contributors"}).addTo(RP.map);
    let tileErrors = 0;
    esri.on("tileerror", () => {
      if(++tileErrors === 4 && RP.map){
        RP.map.removeLayer(esri);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(RP.map);
      }
    });
    draw();
  }).catch(e => { RP.note = "Map couldn't load: " + e.message; draw(); });
  refresh();
}

/* ============================================================
   ROUTER
   ============================================================ */
function route(){
  const h = location.hash || "#/";
  if(h.startsWith("#/app")){
    if(!S.profile){ location.replace("#/signin"); return; }
    const [path, qs] = h.slice(2).split("?");
    renderApp(path.split("/")[1] || "dashboard", new URLSearchParams(qs || ""));
  } else if(h.startsWith("#/signin")){
    if(S.profile && !h.includes("new")){ const nx = (h.match(/[?&]next=([a-z]+)/) || [])[1]; location.replace("#/app/" + (nx && NAV_PAGES.includes(nx) ? nx : "dashboard")); return; }
    renderSignin(h.includes("new"));
  } else if(h.startsWith("#/") ){
    renderSite(); window.scrollTo(0,0);
  }
}
/* Open the forms in a new tab. If the browser or the page it is shown in
   blocks new tabs, show the link so it can be opened or copied instead. */
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[target="_blank"]');
  if(!a || !/^https?:/i.test(a.getAttribute("href") || "")) return;
  e.preventDefault();
  const url = a.href;
  let w = null;
  try{ w = window.open(url, "_blank"); }catch(err){ w = null; }
  if(w){ try{ w.opener = null; }catch(err){} return; }
  showLinkDialog(url, a.textContent.trim());
});
function showLinkDialog(url, name){
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.style.alignItems = "center"; scrim.style.justifyContent = "center"; scrim.style.padding = "20px";
  scrim.innerHTML = `<div class="signin-card" role="dialog" aria-modal="true" aria-labelledby="ld-t" style="max-width:480px">
    <h2 id="ld-t" style="font-size:22px;margin-bottom:8px">Open ${esc(name || "the form")}</h2>
    <p style="color:var(--muted);margin:0 0 16px">Your browser didn't open a new tab. Use the button below, or copy the link.</p>
    <div class="field"><label for="ld-u">Form address</label><input id="ld-u" readonly value="${esc(url)}"></div>
    <div class="row-actions" style="justify-content:flex-end">
      <button class="btn btn-ghost" type="button" id="ld-close">Close</button>
      <button class="btn btn-ghost" type="button" id="ld-copy">Copy link</button>
      <a class="btn btn-primary" id="ld-go" href="${esc(url)}" target="_top" rel="noopener">Open form</a>
    </div></div>`;
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener("click", ev => { if(ev.target === scrim) close(); });
  scrim.querySelector("#ld-close").addEventListener("click", close);
  scrim.querySelector("#ld-copy").addEventListener("click", async () => {
    const inp = scrim.querySelector("#ld-u");
    try{ await navigator.clipboard.writeText(url); toast("Link copied."); }
    catch(err){ inp.select(); try{ document.execCommand("copy"); toast("Link copied."); }catch(e2){ toast("Select the address and copy it."); } }
  });
  scrim.querySelector("#ld-go").focus();
}
const NAV_PAGES = ["dashboard","jobs","renewals","route","tools","settings"];
window.addEventListener("hashchange", route);
route();
